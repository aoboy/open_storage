name: docs

on:
  push:
    paths:
      - "storage-dataflow/docs/**"
      - "storage-dataflow/scripts/build_doc.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# The repository root is the monorepo root; the project lives below it.
defaults:
  run:
    working-directory: storage-dataflow

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended

      - name: Render design PDF
        run: ./scripts/build_doc.sh

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: storage-dataflow-design
          path: storage-dataflow/out/*.pdf
          if-no-files-found: error
