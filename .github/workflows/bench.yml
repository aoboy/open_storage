name: bench

# Nightly control-plane regression gate (plan W6.5, design 00 section
# 11.3): fail when p99 regresses more than 5% against the median of the
# last 7 days. Never ctest-gated — it needs history and a quiet runner.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # list/download the last 7 days of bench artifacts

# The repository root is the monorepo root; the project lives below it.
defaults:
  run:
    working-directory: storage-dataflow

jobs:
  control-plane-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@1.100.0

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install cffi pyyaml xxhash "setuptools>=68" wheel

      - name: Run benchmark (C gate + control-plane microbench)
        run: ./scripts/run_bench.sh --iterations 20000

      # Upload before the gate: a regressed night still becomes history
      # (the fetch below excludes this run by id).
      - name: Upload the night's result
        uses: actions/upload-artifact@v6
        with:
          name: wm-control-bench
          path: storage-dataflow/out/bench/
          if-no-files-found: error
          retention-days: 14

      - name: Paired C/Rust LT fountain benchmark
        run: ./scripts/bench_fountain_paired.sh --require

      - name: Upload the paired fountain record
        uses: actions/upload-artifact@v6
        with:
          name: fountain-paired
          path: storage-dataflow/out/bench/fountain_paired.txt
          if-no-files-found: error
          retention-days: 14

      - name: Fetch paired fountain history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch_bench_history.py \
            --repo "$GITHUB_REPOSITORY" --days 7 \
            --out fountain-history --name fountain-paired \
            --file fountain_paired.txt --exclude-run "$GITHUB_RUN_ID"

      - name: Validate paired fountain history
        run: |
          shopt -s nullglob
          files=(fountain-history/*.txt)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "fountain history: no prior paired artifact yet"
          else
            for file in "${files[@]}"; do
              python3 scripts/bench_fountain_compare.py "$file"
            done
          fi

      - name: Summarize paired fountain history
        run: |
          python3 scripts/bench_fountain_history.py \
            --history fountain-history --out out/bench/fountain_history.json

      - name: Upload the paired fountain history report
        uses: actions/upload-artifact@v6
        with:
          name: fountain-paired-history
          path: storage-dataflow/out/bench/fountain_history.json
          if-no-files-found: error
          retention-days: 14

      - name: Fetch the 7-day history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch_bench_history.py \
            --repo "$GITHUB_REPOSITORY" --days 7 \
            --out bench-history --exclude-run "$GITHUB_RUN_ID"

      - name: Regression gate (p99 > 5% vs the 7-day median)
        run: |
          python3 scripts/bench_regression.py \
            --history bench-history \
            --current out/bench/wm_control_microbench.json \
            --metric step_ns.p99 --threshold 0.05

      - name: Upload the C bench record
        uses: actions/upload-artifact@v6
        with:
          name: wm-c-bench
          path: storage-dataflow/build/bench_results.txt
          if-no-files-found: error
          retention-days: 14
