# Generated by sdf.common.alerts; edit ALERT_SPECS, not this file.
groups:
- name: sdf-rollout-guardrails
  rules:
  - alert: SdfWmFillP99RegressionWarning
    expr: ((histogram_quantile(0.99, sum(rate(sdf_wm_fill_duration_seconds_bucket{arm="treatment"}[5m]))
      by (le))) / median_over_time((histogram_quantile(0.99, sum(rate(sdf_wm_fill_duration_seconds_bucket{arm="treatment"}[5m]))
      by (le)))[7d:5m]) - 1) > 0.050000000000000003
    for: 10m
    labels:
      severity: warning
      component: sdf
    annotations:
      summary: Cache-fill p99 regression above the 7-day median
      threshold: '0.050000000000000003'
  - alert: SdfWmFillP99RegressionPage
    expr: ((histogram_quantile(0.99, sum(rate(sdf_wm_fill_duration_seconds_bucket{arm="treatment"}[5m]))
      by (le))) / median_over_time((histogram_quantile(0.99, sum(rate(sdf_wm_fill_duration_seconds_bucket{arm="treatment"}[5m]))
      by (le)))[7d:5m]) - 1) > 0.10000000000000001
    for: 5m
    labels:
      severity: page
      component: sdf
    annotations:
      summary: Cache-fill p99 regression above the 7-day median
      threshold: '0.10000000000000001'
  - alert: SdfFluidRepairP99RegressionWarning
    expr: ((histogram_quantile(0.99, sum(rate(sdf_fluid_repair_duration_seconds_bucket{arm!="control"}[5m]))
      by (le))) / scalar(histogram_quantile(0.99, sum(rate(sdf_fluid_repair_duration_seconds_bucket{arm="control"}[5m]))
      by (le))) - 1) > 0
    for: 10m
    labels:
      severity: warning
      component: sdf
    annotations:
      summary: FLUID repair p99 regression above the ARQ baseline
      threshold: '0'
  - alert: SdfFluidRepairP99RegressionPage
    expr: ((histogram_quantile(0.99, sum(rate(sdf_fluid_repair_duration_seconds_bucket{arm!="control"}[5m]))
      by (le))) / scalar(histogram_quantile(0.99, sum(rate(sdf_fluid_repair_duration_seconds_bucket{arm="control"}[5m]))
      by (le))) - 1) > 0.10000000000000001
    for: 5m
    labels:
      severity: page
      component: sdf
    annotations:
      summary: FLUID repair p99 regression above the ARQ baseline
      threshold: '0.10000000000000001'
  - alert: SdfFluidBandwidthOverheadWarning
    expr: sum(rate(sdf_fluid_repair_bytes_total{kind="sent"}[5m])) / sum(rate(sdf_fluid_repair_bytes_total{kind="useful"}[5m]))
      > 1.2
    for: 10m
    labels:
      severity: warning
      component: sdf
    annotations:
      summary: FLUID sent/useful bandwidth overhead
      threshold: '1.2'
  - alert: SdfFluidBandwidthOverheadPage
    expr: sum(rate(sdf_fluid_repair_bytes_total{kind="sent"}[5m])) / sum(rate(sdf_fluid_repair_bytes_total{kind="useful"}[5m]))
      > 1.5
    for: 5m
    labels:
      severity: page
      component: sdf
    annotations:
      summary: FLUID sent/useful bandwidth overhead
      threshold: '1.5'
  - alert: SdfFluidArqFallbackRateWarning
    expr: sum(rate(sdf_fluid_arq_fallback_total[5m])) / sum(rate(sdf_fluid_repair_duration_seconds_count[5m]))
      > 0.02
    for: 10m
    labels:
      severity: warning
      component: sdf
    annotations:
      summary: FLUID ARQ fallback fraction
      threshold: '0.02'
  - alert: SdfFluidArqFallbackRatePage
    expr: sum(rate(sdf_fluid_arq_fallback_total[5m])) / sum(rate(sdf_fluid_repair_duration_seconds_count[5m]))
      > 0.050000000000000003
    for: 5m
    labels:
      severity: page
      component: sdf
    annotations:
      summary: FLUID ARQ fallback fraction
      threshold: '0.050000000000000003'
  - alert: SdfArcAddedLatencyP99Warning
    expr: histogram_quantile(0.99, sum(rate(sdf_arc_live_added_latency_ns_bucket[5m]))
      by (le)) > 10000000
    for: 10m
    labels:
      severity: warning
      component: sdf
    annotations:
      summary: ARC live added-latency p99 in nanoseconds
      threshold: '10000000'
  - alert: SdfArcAddedLatencyP99Page
    expr: histogram_quantile(0.99, sum(rate(sdf_arc_live_added_latency_ns_bucket[5m]))
      by (le)) > 25000000
    for: 5m
    labels:
      severity: page
      component: sdf
    annotations:
      summary: ARC live added-latency p99 in nanoseconds
      threshold: '25000000'
  - alert: SdfArcDroppedEntriesWarning
    expr: sum(increase(sdf_arc_dropped_total[5m])) > 0
    for: 0m
    labels:
      severity: warning
      component: sdf
    annotations:
      summary: ARC entries dropped (invalid input or engine rejection)
      threshold: '0'
  - alert: SdfArcDroppedEntriesPage
    expr: sum(increase(sdf_arc_dropped_total[5m])) > 0
    for: 0m
    labels:
      severity: page
      component: sdf
    annotations:
      summary: ARC entries dropped (invalid input or engine rejection)
      threshold: '0'
  - alert: SdfControlLoopLivenessWarning
    expr: sdf_control_loop_missed_intervals >= 2
    for: 0m
    labels:
      severity: warning
      component: sdf
    annotations:
      summary: Control loop missed its configured heartbeat interval
      threshold: '2'
  - alert: SdfControlLoopLivenessPage
    expr: sdf_control_loop_missed_intervals >= 10
    for: 0m
    labels:
      severity: page
      component: sdf
    annotations:
      summary: Control loop missed its configured heartbeat interval
      threshold: '10'
