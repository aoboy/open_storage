name: bench

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml

      - name: Run benchmark
        run: ./scripts/run_bench.sh --iterations 20000

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: wm-control-bench
          path: out/bench/
          if-no-files-found: error
