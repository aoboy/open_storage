replicaCount: 1
image:
  repository: sdf
  tag: "1.0.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []
podAnnotations: {}
strategyType: Recreate
terminationGracePeriodSeconds: 10

serviceAccount:
  create: true
  name: ""
  annotations: {}
automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  # Create this ConfigMap with wm.toml, fluid.toml, and arc.toml.
  existingConfigMap: sdf-config
  mountPath: /etc/sdf

service:
  enabled: true
  type: ClusterIP
  port: 8080
  annotations: {}

health:
  port: 8080
  path: /healthz
  readinessPath: /readyz
  initialDelaySeconds: 2
  periodSeconds: 10

env: {}
extraArgs: []
nodeSelector: {}
tolerations: []
affinity: {}
